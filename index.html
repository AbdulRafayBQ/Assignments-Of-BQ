
<div class="search-box">
  <div class="search-tabs">
    <a href="#buy" class="tab active">Buy</a>
    <a href="#rent" class="tab">Rent</a>
    <a href="#projects" class="tab">Projects</a>
  </div>

  <form action="#properties">
    <label for="city">City or Location</label>
    <input
      id="city"
      type="text"
      placeholder="e.g. DHA, Karachi"
    >

    <label for="type">Property Type</label>
    <select id="type">
      <option>Houses</option>
      <option>Flats & Apartments</option>
      <option>Plots</option>
      <option>Commercial</option>
    </select>

    <button type="submit" class="search-btn">
      Search Properties
    </button>
  </form>
</div>
