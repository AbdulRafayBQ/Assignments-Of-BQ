<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Advanced Assignment</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 18px;
      background: #f3f5f9;
      color: #182230;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 30px;
      background: #ffffff;
      border: 1px solid #e3e8ef;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(20, 35, 55, 0.07);
    }
    h1 { margin: 0 0 10px; font-size: clamp(25px, 4vw, 34px); }
    p { margin: 0 0 22px; color: #526174; line-height: 1.6; }
    pre {
      overflow-x: auto;
      margin: 0;
      padding: 22px;
      border-radius: 12px;
      background: #111827;
      color: #e5edf8;
      font: 14px/1.65 Consolas, Monaco, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .hint { margin-top: 16px; font-size: 13px; }
  </style>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>JavaScript Advanced Assignment</h1>
    <p>Solutions to all 10 questions. The results are shown below and are also available in the browser console (F12 → Console).</p>
    <pre id="output" aria-live="polite">Loading assignment results...</pre>
    <p class="hint">To run with Node.js, open this folder in VS Code and enter <code>node app.js</code> in the terminal.</p>
  </main>
</body>
</html>
